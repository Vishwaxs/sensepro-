openapi: 3.1.0

info:
  title: SensePro+ API
  version: "0.1.0"
  description: |
    Contract consumed by the frontend. It covers the implemented health check,
    authenticated session create/end lifecycle, and `/ws/capture` channel.
    Routes still marked `x-phase: 2` are placeholders and are not implemented.

    The WebSocket schemas mirror `backend/app/ws.py` and
    `backend/vision/pipeline.py`. Frames are processed in memory and discarded.

    Enum and field names follow the database schema (supabase/migrations/0001_init.sql)
    as authoritative: zones are `front|mid|back` (aggregates add `class`), session
    mode is `lecture|exam|workshop`, students carry `reg_no`/`full_name`.

servers:
  - url: http://localhost:8000
    description: Local inference backend (dev)

tags:
  - name: health
  - name: capture
    description: Live browser-capture WebSocket channel.
  - name: sessions
    description: Authenticated class-session lifecycle.
  - name: students
    description: Student read placeholders; dashboards normally use Supabase RLS.

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe.
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /ws/capture:
    get:
      tags: [capture]
      operationId: wsCapture
      summary: WebSocket capture channel (not a plain GET).
      description: |
        **This is a WebSocket endpoint**, documented as a GET path because
        OpenAPI 3.1 has no native WebSocket operation. A verified teacher/admin
        access token is required in the `token` query parameter.

        `mode` is query-only and defaults to `lecture`; a session id does not
        infer or override it. `session_id` may be supplied in the query or a
        client message before attachment. The first non-empty id attaches
        persistence. With no id, recognition still runs but no session writes
        or live engagement / proctor view are created.

        Client → server messages:
          - `FrameMessage`  {type:"frame", ts, jpg_b64, session_id?}
          - `EndMessage`    {type:"end", ts}

        Server → client messages:
          - `ResultMessage` with attendance plus optional mode-specific views
          - `ErrorMessage` (connection stays open)
          - `SessionEndedMessage` (reply to `end`; server then closes)

        An explicit `end` also ends the attached database session. A transport
        disconnect only cleans up connection state so the client can reconnect.
      parameters:
        - name: token
          in: query
          required: true
          description: Short-lived verified access token for a teacher/admin user.
          schema:
            type: string
        - name: mode
          in: query
          required: false
          description: Processing mode for this socket; defaults to lecture.
          schema:
            $ref: "#/components/schemas/SessionMode"
            default: lecture
        - name: session_id
          in: query
          required: false
          description: Existing class session to attach; may instead be sent in the first message.
          schema:
            type: string
            format: uuid
      responses:
        "101":
          description: Switching Protocols — WebSocket handshake accepted.
        "403":
          description: Handshake rejected; socket closes with policy code 1008.

  /v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: Start a class session (teacher/admin only).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /v1/sessions/{session_id}/end:
    post:
      tags: [sessions]
      operationId: endSession
      summary: End a class session (teacher/admin only).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnd"

  /v1/sessions/{session_id}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: Session plus its live roster snapshot. (Week 2 — not implemented yet.)
      x-phase: 2
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session with roster.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"

  /v1/students:
    get:
      tags: [students]
      operationId: listStudents
      summary: Roster for a class section. (Week 2 — not implemented yet.)
      x-phase: 2
      parameters:
        - name: class_section
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Student roster.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"

  /v1/students/{id}/attendance:
    get:
      tags: [students]
      operationId: getStudentAttendance
      summary: A student's presence intervals. (Week 2 — not implemented yet.)
      x-phase: 2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Presence intervals for the student.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PresenceInterval"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    # ---------------- health ----------------
    Health:
      type: object
      required: [status, service, vision_backend, proctor_backend]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: sensepro-backend
        vision_backend:
          type: string
          description: Active vision backend (VISION_BACKEND env).
          enum: [stub, insightface]
        proctor_backend:
          type: string
          description: Configured object detector for exam/workshop signals.
          enum: [stub, yolo]

    # ---------------- shared enums ----------------
    PresenceState:
      type: string
      description: Presence state machine output (backend/presence/fsm.py).
      enum: [PRESENT, UNVERIFIED, ABSENT]

    Zone:
      type: string
      description: Seat zone (students/presence use front|mid|back).
      enum: [front, mid, back]

    SessionMode:
      type: string
      enum: [lecture, exam, workshop]

    # ---------------- WebSocket: client -> server ----------------
    FrameMessage:
      type: object
      required: [type, ts, jpg_b64]
      properties:
        type:
          const: frame
        ts:
          type: number
          description: Seconds since session start.
        jpg_b64:
          type: string
          description: Base64-encoded JPEG of the downscaled frame (no data-URI prefix).
        session_id:
          type: string
          format: uuid
          description: Optional attachment when it was not supplied in the query.

    EndMessage:
      type: object
      required: [type, ts]
      properties:
        type:
          const: end
        ts:
          type: number
        session_id:
          type: string
          format: uuid
          description: Optional attachment when it was not supplied in the query.

    ClientMessage:
      oneOf:
        - $ref: "#/components/schemas/FrameMessage"
        - $ref: "#/components/schemas/EndMessage"
      discriminator:
        propertyName: type

    # ---------------- WebSocket: server -> client ----------------
    Face:
      type: object
      required: [track_id, box, student_id, score]
      properties:
        track_id:
          type: integer
          description: Stable tracker id for this face across frames.
        box:
          type: array
          description: "[x1, y1, x2, y2] in SENT-frame pixels."
          items:
            type: integer
          minItems: 4
          maxItems: 4
        student_id:
          type: [string, "null"]
          description: Matched student id, or null when unrecognised.
        score:
          type: number
          description: Cosine match score (0 when unmatched), rounded to 3 dp.

    Transition:
      type: object
      required: [student_id, state]
      properties:
        student_id:
          type: string
        state:
          $ref: "#/components/schemas/PresenceState"

    ResultMessage:
      type: object
      required: [type, ts, faces, transitions, present, attended]
      properties:
        type:
          const: result
        ts:
          type: number
        faces:
          type: array
          items:
            $ref: "#/components/schemas/Face"
        transitions:
          type: array
          description: Presence changes emitted on this re-identification pass (may be empty).
          items:
            $ref: "#/components/schemas/Transition"
        present:
          type: array
          description: Sorted student ids currently in the PRESENT state.
          items:
            type: string
        attended:
          type: array
          description: Sorted ids that crossed the configured attendance sighting threshold.
          items:
            type: string
        proctor:
          description: Present only for an attached exam session.
          $ref: "#/components/schemas/ProctorView"
        engagement:
          description: Present for any attached lecture, exam, or workshop session.
          $ref: "#/components/schemas/EngagementView"

    ProctorDetection:
      type: object
      required: [label, box, confidence, student_id]
      properties:
        label:
          type: string
          enum: [cell phone]
        box:
          type: array
          description: Temporally confirmed box in sent-frame pixels.
          items:
            type: integer
          minItems: 4
          maxItems: 4
        confidence:
          type: number
          minimum: 0
          maximum: 1
        student_id:
          type: [string, "null"]

    ProctorFlag:
      type: object
      required: [id, flag_type, student_id, flagged_at]
      properties:
        id:
          type: string
          format: uuid
        flag_type:
          type: string
          enum: [phone, extra_person, head_pose]
        student_id:
          type: [string, "null"]
        flagged_at:
          type: string
          format: date-time

    HeadPose:
      type: object
      required: [track_id, student_id, yaw, pitch, state]
      properties:
        track_id:
          type: integer
        student_id:
          type: [string, "null"]
        yaw:
          type: number
        pitch:
          type: number
        state:
          type: string
          enum: [neutral, away, sustained_away]

    ProctorView:
      type: object
      required: [detections, flags, backend, ready, poses]
      properties:
        detections:
          type: array
          items:
            $ref: "#/components/schemas/ProctorDetection"
        flags:
          type: array
          description: New pending human-review rows written for this frame.
          items:
            $ref: "#/components/schemas/ProctorFlag"
        backend:
          type: [string, "null"]
          enum: [stub, yolo, null]
        ready:
          type: boolean
        poses:
          type: array
          items:
            $ref: "#/components/schemas/HeadPose"
        error:
          type: [string, "null"]

    PhoneDetectorStatus:
      type: object
      required: [backend, ready, production]
      properties:
        backend:
          type: [string, "null"]
          enum: [stub, yolo, null]
        ready:
          type: boolean
        production:
          type: boolean
        error:
          type: [string, "null"]

    EngagementWindow:
      type: object
      required: [state, window_s, elapsed_s, remaining_s, completed_windows, last_window]
      properties:
        state:
          type: string
          enum: [waiting, collecting]
        window_s:
          type: integer
        elapsed_s:
          type: number
        remaining_s:
          type: number
        completed_windows:
          type: integer
        last_window:
          type: [object, "null"]
          additionalProperties: true

    EngagementView:
      type: object
      required:
        - visible
        - observable
        - attending
        - head_down
        - phone
        - phone_observed
        - still
        - moving
        - still_observed
        - vnei
        - k_min
        - suppressed
        - suppression_reason
        - window
        - reported_zones
      properties:
        visible:
          type: integer
        observable:
          type: integer
        attending:
          type: integer
        head_down:
          type: integer
        phone:
          type: [integer, "null"]
          description: Null when phone inference was unavailable.
        phone_observed:
          type: integer
        still:
          type: integer
        moving:
          type: integer
        still_observed:
          type: integer
        vnei:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        k_min:
          type: integer
        suppressed:
          type: boolean
        suppression_reason:
          type: [string, "null"]
          enum: [privacy_floor, insufficient_pose_observations, null]
        window:
          $ref: "#/components/schemas/EngagementWindow"
        reported_zones:
          type: array
          items:
            $ref: "#/components/schemas/Zone"
        phone_detector:
          description: Present only in exam/workshop modes.
          $ref: "#/components/schemas/PhoneDetectorStatus"

    ErrorMessage:
      type: object
      required: [type, detail]
      properties:
        type:
          const: error
        detail:
          type: string
          description: e.g. "bad frame", "unknown message type". Connection stays open.
        fatal:
          type: boolean
          description: True when this frame's inference failed; the socket remains usable.

    SessionEndedMessage:
      type: object
      required: [type, ts, mode]
      properties:
        type:
          const: session_ended
        ts:
          type: number
        mode:
          $ref: "#/components/schemas/SessionMode"

    ServerMessage:
      oneOf:
        - $ref: "#/components/schemas/ResultMessage"
        - $ref: "#/components/schemas/ErrorMessage"
        - $ref: "#/components/schemas/SessionEndedMessage"
      discriminator:
        propertyName: type

    # ---------------- REST resources ----------------
    Student:
      type: object
      required: [id, reg_no, full_name, class_section]
      properties:
        id:
          type: string
          format: uuid
        reg_no:
          type: string
        full_name:
          type: string
        class_section:
          type: string
        seat_zone:
          $ref: "#/components/schemas/Zone"

    SessionCreate:
      type: object
      required: [class_section]
      properties:
        class_section:
          type: string
        subject:
          type: [string, "null"]
        mode:
          $ref: "#/components/schemas/SessionMode"
          default: lecture

    Session:
      type: object
      required: [id, class_section, mode, starts_at]
      properties:
        id:
          type: string
          format: uuid
        class_section:
          type: string
        subject:
          type: [string, "null"]
        mode:
          $ref: "#/components/schemas/SessionMode"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: [string, "null"]
          format: date-time

    SessionEnd:
      type: object
      required: [id, ended]
      properties:
        id:
          type: string
          format: uuid
        ended:
          const: true

    PresenceInterval:
      type: object
      required: [session_id, student_id, state, started_at]
      properties:
        session_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/PresenceState"
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time

    RosterEntry:
      type: object
      description: Live per-student snapshot for a session's roster view.
      required: [student_id, full_name, state]
      properties:
        student_id:
          type: string
        full_name:
          type: string
        state:
          $ref: "#/components/schemas/PresenceState"
        present_seconds:
          type: number
          description: Accumulated PRESENT duration this session.

    SessionDetail:
      type: object
      required: [session, roster]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        roster:
          type: array
          items:
            $ref: "#/components/schemas/RosterEntry"
