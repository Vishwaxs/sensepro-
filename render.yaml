# SensePro+ production inference API on Render.
#
# The frontend deploys to Vercel because its Clerk Frontend API proxy is a
# Vercel Function. A plain static Render site cannot execute that function.
# Values marked sync: false are entered in the Render dashboard and are never
# committed to this repository.

services:
  - type: web
    name: sensepro-api
    runtime: docker
    plan: 1c-2g
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The Dockerfile installs native libraries, warms InsightFace and YOLO
    # model caches, runs as a non-root user, and starts one model-owning worker.
    healthCheckPath: /readyz
    envVars:
      - key: VISION_BACKEND
        value: insightface
      - key: PROCTOR_BACKEND
        value: yolo
      - key: CAPTURE_SEND_WIDTH
        value: "1920"
      - key: REID_INTERVAL_S
        value: "30"
      - key: MAX_REID_PER_FRAME
        value: "5"
      - key: ENGAGEMENT_WINDOW_S
        value: "60"
      - key: ENROLLMENT_JSON
        value: enrollments.json
      - key: ALLOW_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
