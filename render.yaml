# Render blueprint for SensePro+.
#
# Two services: the FastAPI inference backend, and the frontend as a static
# site (apps/web is a TanStack Start app; `spa: { enabled: true }` in
# vite.config.ts prerenders a self-contained _shell.html so it can be served
# as a plain SPA with no Node server — see that file for how this was
# verified). Deploy with Render > Blueprints > New Blueprint Instance,
# pointed at this repo.
#
# Secrets (sync: false) are NOT stored here — Render prompts for them on first
# deploy. Never commit the Supabase service-role key.
#
# PLAN NOTE: the vision models (InsightFace buffalo_l ~300 MB + YOLOv8n) need
# roughly 1 GB of RAM. The free 512 MB instance will be OOM-killed on model
# load. Either use the `standard` plan below, or set VISION_BACKEND=stub on a
# free instance and demo real recognition locally.

services:
  # ---------------------------------------------------------------- backend --
  - type: web
    name: sensepro-api
    runtime: python
    plan: standard # 2 GB RAM. `starter` (512 MB) cannot load the vision models.
    rootDir: backend
    # Warm BOTH model caches at build time. Left to runtime, InsightFace pulls
    # buffalo_l (~275 MB) on the first capture socket and Ultralytics pulls
    # yolov8n.pt on the first exam session — measured at ~45 s for the YOLO
    # fetch+load alone. That stalls the first real class, re-runs on every cold
    # start because the container filesystem is ephemeral, and fails outright if
    # the working directory is not writable. Downloading here bakes both into
    # the image instead.
    buildCommand: >-
      pip install --upgrade pip &&
      pip install -e ".[insightface,supabase,proctor]" &&
      mkdir -p /opt/render/project/.cache/sensepro &&
      python -c "from ultralytics import YOLO; YOLO('/opt/render/project/.cache/sensepro/yolov8n.pt')" &&
      python -c "from insightface.app import FaceAnalysis; a=FaceAnalysis(name='buffalo_l'); a.prepare(ctx_id=-1, det_size=(640,640))"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7" # insightface/onnxruntime wheels exist for 3.12, not 3.14
      - key: VISION_BACKEND
        value: insightface
      - key: PROCTOR_BACKEND
        value: yolo
      - key: PROCTOR_MODEL_PATH
        value: /opt/render/project/.cache/sensepro/yolov8n.pt # baked in at build; never fetched at runtime
      - key: CAPTURE_SEND_WIDTH
        value: "1920" # see the note on face size below
      - key: REID_INTERVAL_S
        value: "30" # re-ID cost is ~134 ms/face; 30 s amortises a full class
      - key: ENROLLMENT_JSON
        value: enrollments.json # dev/offline fallback only; production reads Supabase pgvector
      - key: ENGAGEMENT_WINDOW_S
        value: "60"
      - key: ALLOW_ORIGINS
        sync: false # set to the frontend URL once it is created — never "*"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false # sb_secret_... server key — secret. Authenticates the Auth
        # Admin API and, on its own, PostgREST too (see app/config.py: both
        # supabase_rest_key and supabase_auth_key fall back to it).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Optional. The classic service_role JWT; when set it is
        # PREFERRED over SUPABASE_SECRET_KEY for PostgREST calls. Leave blank
        # to run on the secret key alone — set it to mirror a local .env that
        # has both, so production takes the same code path that was tested.

  # --------------------------------------------------------------- frontend --
  - type: web
    name: sensepro-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/client
    routes:
      # SPA fallback: Render serves a real static file (JS/CSS/favicon) if the
      # path matches one; only unmatched paths (client routes like /teacher,
      # /capture) fall through to the prerendered shell.
      - type: rewrite
        source: /*
        destination: /_shell.html
    envVars:
      - key: VITE_API_BASE
        sync: false # https://sensepro-api.onrender.com — REQUIRED for QR check-in + roster/session calls
      - key: VITE_WS_URL
        sync: false # ABSOLUTE wss://sensepro-api.onrender.com/ws/capture — REQUIRED for
        # live capture. A static site cannot proxy a WebSocket upgrade, so the
        # browser opens the socket at the API host directly. Must be wss:// (an
        # insecure socket on an https page is blocked as mixed content).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false # publishable key; safe in the client (RLS protects data)
#
# ---------------------------------------------------------------------------
# NOTE ON /capture
#
# Live capture works on this static deploy, but ONLY if VITE_WS_URL is set to
# the absolute wss:// URL of sensepro-api (above). A static site serves from a
# CDN and cannot forward a WebSocket upgrade to another host — Vercel/Netlify/
# Cloudflare rewrites proxy plain HTTP but not WS — so the socket must not be
# same-origin in production. apps/web/src/routes/capture.tsx resolveWsUrl()
# accepts an absolute URL for exactly this reason and upgrades ws:// to wss://
# rather than failing silently.
#
# ---------------------------------------------------------------------------
# FREE TIER WILL NOT WORK for the backend. Measured peak RSS: 402 MB for
# InsightFace alone on a 1080p frame, 718 MB with the YOLO proctor pass. A
# 512 MB Render free instance is OOM-killed during model load, and its 0.1 vCPU
# is ~10x too slow besides. Use `standard` here, or see DEPLOYMENT.md for a
# genuinely free host (Google Cloud Run at 2 GiB) with a ready Dockerfile.
# ---------------------------------------------------------------------------
